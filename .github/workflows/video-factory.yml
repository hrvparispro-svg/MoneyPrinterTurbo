name: Test Generation Video HRV Paris

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installation des dépendances et du SDK Google moderne
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai

      - name: Patch racine de generate_script dans llm.py
        run: |
          cat << 'EOF' > patch_llm.py
          filepath = 'app/services/llm.py'
          with open(filepath, 'r', encoding='utf-8') as f:
              code = f.read()

          target = 'def generate_script('
          new_func = '''def generate_script(video_subject, language="fr", paragraph_number=1, **kwargs):
              from google import genai
              import os, json
              
              api_key = os.environ.get('GEMINI_API_KEY', '').strip()
              client = genai.Client(
                  api_key=api_key,
                  http_options={'api_version': 'v1'}
              )
              
              prompt = f"Tu es un expert TikTok/Shorts. Génère un script vidéo dynamique sur le sujet : '{video_subject}'. Rédige en {language}. Réponds STRICTEMENT en JSON avec les clés : 'video_subject', 'script' (texte de voix off) et 'search_terms' (liste de mots-clés de recherche vidéo en anglais). Aucun autre texte."
              
              res = client.models.generate_content(
                  model='gemini-2.5-flash',
                  contents=prompt,
              )
              
              text = res.text.strip()
              if text.startswith('```json'):
                  text = text[7:]
              if text.startswith('```'):
                  text = text[3:]
              if text.endswith('```'):
                  text = text[:-3]
              
              data = json.loads(text.strip())
              return data

          def _disabled_generate_script('''

          if target in code:
              code = code.replace(target, new_func, 1)
              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(code)
              print('PATCH APPLIQUÉ AVEC SUCCÈS.')
          else:
              print('ERREUR : Fonction target introuvable.')
          EOF
          python patch_llm.py

      - name: Création du fichier config.toml
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cat << 'EOF' > make_config.py
          import os
          g_key = os.environ.get('GEMINI_API_KEY', '').strip()
          p_key = os.environ.get('PEXELS_API_KEY', '').strip()

          config = f'''[app]
          log_level = "INFO"
          llm_provider = "gemini"
          gemini_api_key = "{g_key}"
          pexels_api_keys = ["{p_key}"]
          output_dir = "./storage/output"
          '''
          with open('config.toml', 'w', encoding='utf-8') as f:
              f.write(config)
          print('Fichier config.toml généré.')
          EOF
          python make_config.py

      - name: Lancer la génération de la vidéo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python cli.py --video-subject "Comment protéger sa santé mentale face au stress au travail - hrv-paris.com" --video-lang "fr"

      - name: Sauvegarder la vidéo dans les résultats
        uses: actions/upload-artifact@v4
        with:
          name: video-test-hrv
          path: ./storage/output/*.mp4
