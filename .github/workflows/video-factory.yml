name: Test Generation Video HRV Paris

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Création du fichier de configuration config.toml
        run: |
          python -c "
          config = '''[app]
          log_level = \"INFO\"
          llm_provider = \"gemini\"
          output_dir = \"./storage/output\"

          [gemini]
          api_key = \"${{ secrets.GEMINI_API_KEY }}\"
          model_name = \"gemini-1.5-flash\"

          [pexels]
          api_keys = [\"${{ secrets.PEXELS_API_KEY }}\"]
          '''
          with open('config.toml', 'w', encoding='utf-8') as f:
              f.write(config)
          "

      - name: Lancer la génération de la vidéo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python cli.py --video-subject "Comment protéger sa santé mentale face au stress au travail - hrv-paris.com" --video-lang "fr"

      - name: Sauvegarder la vidéo dans les résultats
        uses: actions/upload-artifact@v4
        with:
          name: video-test-hrv
          path: ./storage/output/*.mp4
