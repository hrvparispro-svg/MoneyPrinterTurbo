name: Test Generation Video HRV Paris

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Création propre du fichier config.toml
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -c "
          import os
          g_key = os.environ.get('GEMINI_API_KEY', '').strip()
          p_key = os.environ.get('PEXELS_API_KEY', '').strip()
          
          config = f'''[app]
          log_level = \"INFO\"
          llm_provider = \"gemini\"
          gemini_api_key = \"{g_key}\"
          gemini_model_name = \"gemini-1.5-flash\"
          pexels_api_keys = [\"{p_key}\"]
          output_dir = \"./storage/output\"

          [gemini]
          api_key = \"{g_key}\"
          model_name = \"gemini-1.5-flash\"
          '''
          with open('config.toml', 'w', encoding='utf-8') as f:
              f.write(config)
          print('Configuration config.toml écrite avec succès.')
          "

      - name: Lancer la génération de la vidéo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python cli.py --video-subject "Comment protéger sa santé mentale face au stress au travail - hrv-paris.com" --video-lang "fr"

      - name: Sauvegarder la vidéo dans les résultats
        uses: actions/upload-artifact@v4
        with:
          name: video-test-hrv
          path: ./storage/output/*.mp4
