name: Test Generation Video HRV Paris

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installation des dépendances et du SDK Google
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai

      - name: Patch de llm.py (Script 100% texte pur)
        run: |
          cat << 'EOF' > patch_llm.py
          filepath = 'app/services/llm.py'
          with open(filepath, 'r', encoding='utf-8') as f:
              code = f.read()

          target_script = 'def generate_script('
          new_script = '''def generate_script(video_subject, language="fr", paragraph_number=1, **kwargs):
              from google import genai
              import os, time
              
              api_key = os.environ.get('GEMINI_API_KEY', '').strip()
              client = genai.Client(api_key=api_key, http_options={'api_version': 'v1'})
              
              prompt = f"Tu es un expert TikTok. Rédige un script de voix off court, percutant et engageant en {language} sur le sujet suivant : '{video_subject}'. Écris UNIQUEMENT le texte de la voix off, sans aucune balise, sans JSON, sans guillemets, sans titre."
              
              res = None
              for attempt in range(3):
                  try:
                      res = client.models.generate_content(model='gemini-3.8-flash', contents=prompt)
                      if res and res.text: break
                  except Exception:
                      time.sleep(3)
              
              if res and res.text:
                  clean_text = res.text.strip().replace('```', '')
                  return clean_text

              return "Le stress au travail peut impacter votre santé mentale. Pour vous protéger, posez des limites claires, pratiquez la respiration profonde et faites des pauses régulières. Prenez soin de votre bien-être au quotidien sur hrv-paris.com."

          def _disabled_generate_script('''

          if target_script in code:
              code = code.replace(target_script, new_script, 1)

          target_terms = 'def generate_terms('
          new_terms = '''def generate_terms(video_subject, paragraph_number=1, language="fr", **kwargs):
              return ["work stress", "mental health", "office relaxation", "meditation"]

          def _disabled_generate_terms('''

          if target_terms in code:
              code = code.replace(target_terms, new_terms, 1)

          with open(filepath, 'w', encoding='utf-8') as f:
              f.write(code)
          print('PATCH TEXTE PUR APPLIQUÉ.')
          EOF
          python patch_llm.py

      - name: Création du fichier config.toml
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cat << 'EOF' > make_config.py
          import os
          g_key = os.environ.get('GEMINI_API_KEY', '').strip()
          p_key = os.environ.get('PEXELS_API_KEY', '').strip()

          config = f'''[app]
          log_level = "INFO"
          llm_provider = "gemini"
          gemini_api_key = "{g_key}"
          pexels_api_keys = ["{p_key}"]
          output_dir = "./storage/output"
          subtitle_provider = "edge"
          '''
          with open('config.toml', 'w', encoding='utf-8') as f:
              f.write(config)
          print('Config générée.')
          EOF
          python make_config.py

      - name: Lancer la génération avec Voix Homme Mûre et Sous-titres forcés
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python cli.py \
            --video-subject "Comment protéger sa santé mentale face au stress au travail - hrv-paris.com" \
            --video-lang "fr" \
            --voice-name "fr-FR-HenriNeural" \
            --subtitle-enabled

      - name: Sauvegarder UNIQUEMENT la vidéo finale MP4
        uses: actions/upload-artifact@v4
        with:
          name: video-finale-hrv
          path: ./storage/tasks/**/final-*.mp4
