name: Test Generation Video HRV Paris

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de FFmpeg, ImageMagick et polices Montserrat
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-montserrat

      - name: Installation des dépendances Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai openai-whisper

      - name: Patch Global Sanitisé (Script Long + Gemini TTS Bodi + Sous-titres 2 mots max sans IndentationError)
        run: |
          cat << 'EOF' > patch_all.py
          import os, subprocess, base64, wave, re

          # 1. GENERATION DE SCRIPT LONG (> 60s / 160-200 mots)
          llm_path = 'app/services/llm.py'
          with open(llm_path, 'r', encoding='utf-8') as f:
              llm_code = f.read()

          target_script = 'def generate_script('
          new_script = '''def generate_script(video_subject, language="fr", paragraph_number=1, **kwargs):
              from google import genai
              import time
              api_key = os.environ.get('GEMINI_API_KEY', '').strip()
              client = genai.Client(api_key=api_key, http_options={'api_version': 'v1beta'})
              prompt = f"Tu es un expert TikTok. Rédige un script de voix off détaillé, structuré et captivant en {language} sur le sujet : '{video_subject}'. Le texte doit absolument contenir entre 160 et 200 mots pour garantir une durée de lecture supérieure à 60 secondes. Écris UNIQUEMENT le texte brut de la voix off, sans aucune balise, sans JSON, sans guillemets, sans titre."
              
              res = None
              for attempt in range(3):
                  try:
                      res = client.models.generate_content(model='gemini-3.8-flash', contents=prompt)
                      if res and res.text: break
                  except Exception:
                      time.sleep(3)
              
              if res and res.text:
                  return res.text.strip().replace('```', '')

              return "Le stress au travail peut lourdement impacter votre santé mentale et votre équilibre de vie. Pour vous protéger efficacement au quotidien, il est primordial d'instaurer des limites strictes entre vie professionnelle et vie personnelle. Prenez l'habitude de pratiquer la respiration profonde, de faire des pauses régulières sans écran, et d'exprimer vos ressentis. Votre bien-être mental est une priorité absolue. Retrouvez tous nos conseils d'experts et un accompagnement sur mesure pour préserver votre santé au quotidien sur hrv-paris.com."

          def _disabled_generate_script('''

          if target_script in llm_code:
              llm_code = llm_code.replace(target_script, new_script, 1)

          target_terms = 'def generate_terms('
          new_terms = '''def generate_terms(video_subject, paragraph_number=1, language="fr", **kwargs):
              return ["work stress", "mental health", "office relaxation", "meditation"]

          def _disabled_generate_terms('''

          if target_terms in llm_code:
              llm_code = llm_code.replace(target_terms, new_terms, 1)

          with open(llm_path, 'w', encoding='utf-8') as f:
              f.write(llm_code)


          # 2. TTS GEMINI 3.8 FLASH VOIX BODI (PAR PHRASES + PARALLELE)
          voice_path = 'app/services/voice.py'
          if os.path.exists(voice_path):
              with open(voice_path, 'r', encoding='utf-8') as f:
                  voice_code = f.read()

              gemini_tts_override = '''
          def azure_tts_v1(*args, **kwargs):
              from google import genai
              from google.genai import types
              import base64, os, subprocess, wave, re

              text = ""
              tts_file = "output.mp3"
              for arg in args:
                  if isinstance(arg, str):
                      if arg.endswith(".mp3") or "/" in arg or "\\\\" in arg:
                          tts_file = arg
                      elif not text:
                          text = arg
              if not text:
                  text = kwargs.get("text", "Texte par défaut")
              if "tts_file" in kwargs and isinstance(kwargs["tts_file"], str):
                  tts_file = kwargs["tts_file"]

              api_key = os.environ.get('GEMINI_API_KEY', '').strip()
              client = genai.Client(api_key=api_key, http_options={'api_version': 'v1beta'})

              raw_sentences = re.split(r'(?<=[.!?])\s+', text)
              sentences = [s.strip() for s in raw_sentences if len(s.strip()) > 2]
              if not sentences:
                  sentences = [text]

              all_pcm_bytes = bytearray()

              for sentence in sentences:
                  try:
                      response = client.models.generate_content(
                          model="gemini-3.8-flash-tts",
                          contents=sentence,
                          config=types.GenerateContentConfig(
                              response_modalities=["AUDIO"],
                              speech_config=types.SpeechConfig(
                                  voice_config=types.VoiceConfig(
                                      prebuilt_voice_config=types.PrebuiltVoiceConfig(
                                          voice_name="Bodi"
                                      )
                                  )
                              )
                          )
                      )
                      for part in response.candidates[0].content.parts:
                          if part.inline_data and part.inline_data.data:
                              all_pcm_bytes.extend(base64.b64decode(part.inline_data.data))
                  except Exception as e:
                      print(f"Erreur Gemini TTS Bodi : {e}")

              os.makedirs(os.path.dirname(os.path.abspath(tts_file)), exist_ok=True)

              wav_tmp = tts_file.replace('.mp3', '_tmp.wav')
              with wave.open(wav_tmp, 'wb') as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(24000)
                  wf.writeframes(bytes(all_pcm_bytes))

              cmd = ["ffmpeg", "-y", "-i", wav_tmp, "-c:a", "libmp3lame", "-b:a", "192k", tts_file]
              subprocess.run(cmd, check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)

              if os.path.exists(wav_tmp):
                  os.remove(wav_tmp)

              return tts_file

          def _disabled_azure_tts_v1(
              '''

              if 'def azure_tts_v1(' in voice_code:
                  voice_code = voice_code.replace('def azure_tts_v1(', gemini_tts_override, 1)
              else:
                  voice_code += "\n" + gemini_tts_override

              with open(voice_path, 'w', encoding='utf-8') as f:
                  f.write(voice_code)


          # 3. POST-TRAITEMENT SOUS-TITRES DYNAMIQUES (MAX 2 MOTS PAR LIGNE, PROPREMENT INDENTÉ)
          sub_path = 'app/services/subtitle.py'
          if os.path.exists(sub_path):
              with open(sub_path, 'r', encoding='utf-8') as f:
                  sub_code = f.read()

              dynamic_sub_code = '''

          def _split_srt_dynamic(srt_path):
              if not os.path.exists(srt_path):
                  return
              with open(srt_path, 'r', encoding='utf-8') as f:
                  content = f.read()
              blocks = content.strip().split('\\n\\n')
              new_blocks = []
              counter = 1
              def time_to_sec(t_str):
                  try:
                      parts = t_str.replace(',', '.').split(':')
                      return int(parts[0]) * 3600 + int(parts[1]) * 60 + float(parts[2])
                  except Exception:
                      return 0.0
              def sec_to_time(sec):
                  h = int(sec // 3600)
                  m = int((sec % 3600) // 60)
                  s = int(sec % 60)
                  ms = int(round((sec - int(sec)) * 1000))
                  return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"
              for block in blocks:
                  lines = block.split('\\n')
                  if len(lines) >= 3 and '-->' in lines[1]:
                      try:
                          start_str, end_str = lines[1].split('-->')
                          start_sec = time_to_sec(start_str.strip())
                          end_sec = time_to_sec(end_str.strip())
                          words = " ".join(lines[2:]).strip().split()
                          if not words:
                              continue
                          chunks = [" ".join(words[i:i+2]) for i in range(0, len(words), 2)]
                          total_dur = end_sec - start_sec
                          chunk_dur = total_dur / len(chunks) if chunks else total_dur
                          for idx, chunk in enumerate(chunks):
                              c_start = start_sec + idx * chunk_dur
                              c_end = start_sec + (idx + 1) * chunk_dur
                              new_blocks.append(f"{counter}\\n{sec_to_time(c_start)} --> {sec_to_time(c_end)}\\n{chunk}")
                              counter += 1
                      except Exception:
                          new_blocks.append(block)
                  elif block.strip():
                      new_blocks.append(block)
              with open(srt_path, 'w', encoding='utf-8') as f:
                  f.write("\\n\\n".join(new_blocks) + "\\n")
          '''
              sub_code += dynamic_sub_code
              
              if 'return subtitle_file' in sub_code:
                  sub_code = sub_code.replace('return subtitle_file', '_split_srt_dynamic(subtitle_file)\n    return subtitle_file')

              with open(sub_path, 'w', encoding='utf-8') as f:
                  f.write(sub_code)

          print('PATCH PARFAITEMENT INDENTÉ ET VALIDÉ.')
          EOF
          python patch_all.py

      - name: Création du config.toml (Zero Musique + Police Montserrat-Bold)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cat << 'EOF' > make_config.py
          import os
          g_key = os.environ.get('GEMINI_API_KEY', '').strip()
          p_key = os.environ.get('PEXELS_API_KEY', '').strip()

          config = f'''[app]
          log_level = "INFO"
          llm_provider = "gemini"
          gemini_api_key = "{g_key}"
          pexels_api_keys = ["{p_key}"]
          output_dir = "./storage/output"
          subtitle_provider = "whisper"

          [video]
          voice_name = "Bodi"
          bgm_type = "none"
          bgm_volume = 0.0
          video_volume = 0.0
          subtitle_enabled = true
          font_name = "Montserrat-Bold"
          text_fore_color = "#FFFFFF"
          font_size = 60
          '''
          with open('config.toml', 'w', encoding='utf-8') as f:
              f.write(config)
          print('Config.toml générée sans musique.')
          EOF
          python make_config.py

      - name: Lancer la génération de la vidéo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python cli.py \
            --video-subject "Comment protéger sa santé mentale face au stress au travail - hrv-paris.com" \
            --video-lang "fr" \
            --voice-name "Bodi" \
            --subtitle-enabled

      - name: Sauvegarder la vidéo finale MP4
        uses: actions/upload-artifact@v4
        with:
          name: video-finale-hrv
          path: ./storage/tasks/**/final-*.mp4
