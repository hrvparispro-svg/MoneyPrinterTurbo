name: Test Generation Video HRV Paris

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade google-generativeai

      - name: Patch du code source (Forcer gemini-1.5-flash-latest)
        run: |
          python -c "
          with open('app/services/llm.py', 'r', encoding='utf-8') as f:
              code = f.read()
          # Remplace toutes les variantes obsolètes/erronées par l'identifiant exact v1beta
          code = code.replace('gemini-3.1-pro-preview', 'gemini-1.5-flash-latest')
          code = code.replace('gemini-1.0-pro', 'gemini-1.5-flash-latest')
          code = code.replace('gemini-1.5-flash', 'gemini-1.5-flash-latest')
          code = code.replace('gemini-1.5-flash-latest-latest', 'gemini-1.5-flash-latest')
          with open('app/services/llm.py', 'w', encoding='utf-8') as f:
              f.write(code)
          print('Patch llm.py appliqué avec succès.')
          "

      - name: Création du fichier config.toml
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -c "
          import os
          g_key = os.environ.get('GEMINI_API_KEY', '').strip()
          p_key = os.environ.get('PEXELS_API_KEY', '').strip()
          
          config = f'''[app]
          log_level = \"INFO\"
          llm_provider = \"gemini\"
          gemini_api_key = \"{g_key}\"
          gemini_model_name = \"gemini-1.5-flash-latest\"
          pexels_api_keys = [\"{p_key}\"]
          output_dir = \"./storage/output\"
          '''
          with open('config.toml', 'w', encoding='utf-8') as f:
              f.write(config)
          print('Fichier config.toml généré.')
          "

      - name: Lancer la génération de la vidéo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python cli.py --video-subject "Comment protéger sa santé mentale face au stress au travail - hrv-paris.com" --video-lang "fr"

      - name: Sauvegarder la vidéo dans les résultats
        uses: actions/upload-artifact@v4
        with:
          name: video-test-hrv
          path: ./storage/output/*.mp4
