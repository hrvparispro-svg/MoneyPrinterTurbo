name: Test Generation Video HRV Paris

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Installation des dépendances et nouveau SDK Google
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai

      - name: Patch direct de la méthode LLM avec google-genai
        run: |
          python -c "
          filepath = 'app/services/llm.py'
          with open(filepath, 'r', encoding='utf-8') as f:
              code = f.read()

          old_target = 'def _generate_response('
          new_logic = '''def _generate_response(*args, **kwargs):
              from google import genai
              import os
              api_key = os.environ.get('GEMINI_API_KEY', '').strip()
              client = genai.Client(api_key=api_key)
              
              prompt = kwargs.get('prompt')
              if not prompt:
                  if len(args) > 1:
                      prompt = args[1]
                  elif len(args) > 0:
                      prompt = args[0]
                  else:
                      prompt = ''
              
              response = client.models.generate_content(
                  model='gemini-1.5-flash',
                  contents=prompt,
              )
              return response.text

          def _disabled_generate_response('''

          if old_target in code:
              code = code.replace(old_target, new_logic, 1)
              with open(filepath, 'w', encoding='utf-8') as f:
                  f.write(code)
              print('PATCH SWAP SDK GENERATIVE AI APPLIQUÉ AVEC SUCCÈS.')
          else:
              print('Cible introuvable dans llm.py')
          "

      - name: Création du fichier config.toml
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -c "
          import os
          g_key = os.environ.get('GEMINI_API_KEY', '').strip()
          p_key = os.environ.get('PEXELS_API_KEY', '').strip()
          
          config = f'''[app]
          log_level = \"INFO\"
          llm_provider = \"gemini\"
          gemini_api_key = \"{g_key}\"
          gemini_model_name = \"gemini-1.5-flash\"
          pexels_api_keys = [\"{p_key}\"]
          output_dir = \"./storage/output\"
          '''
          with open('config.toml', 'w', encoding='utf-8') as f:
              f.write(config)
          print('Fichier config.toml généré.')
          "

      - name: Lancer la génération de la vidéo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python cli.py --video-subject "Comment protéger sa santé mentale face au stress au travail - hrv-paris.com" --video-lang "fr"

      - name: Sauvegarder la vidéo dans les résultats
        uses: actions/upload-artifact@v4
        with:
          name: video-test-hrv
          path: ./storage/output/*.mp4
